<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 1360 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Figure 1. Two sites, two split failover pairs, per-pair ingress preference, colocation L2 interconnect. -->
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#6f6d66"/>
    </marker>
  </defs>
  <rect width="1360" height="1080" fill="#ffffff"/>

  <!-- internet -->
  <rect x="380" y="50" width="600" height="105" rx="16" fill="#eeeefc" stroke="#4a48b8" stroke-width="2.5"/>
  <text x="680" y="95" font-size="30" font-weight="bold" text-anchor="middle" fill="#2f2d8a">Internet transit</text>
  <text x="680" y="132" font-size="24" text-anchor="middle" fill="#4a48b8">Both ISPs peer at both sites</text>
  <line x1="620" y1="155" x2="365" y2="203" stroke="#6f6d66" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="740" y1="155" x2="995" y2="203" stroke="#6f6d66" stroke-width="2" marker-end="url(#arr)"/>

  <!-- East site -->
  <rect x="80" y="205" width="440" height="420" rx="22" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="108" y="250" font-size="28" font-weight="bold" fill="#3d3d3d">East site</text>
  <rect x="120" y="280" width="360" height="105" rx="14" fill="#e6f4f1" stroke="#0e7c6b" stroke-width="2.5"/>
  <text x="300" y="322" font-size="28" font-weight="bold" text-anchor="middle" fill="#0e5c50">FTD-A1</text>
  <text x="300" y="360" font-size="24" text-anchor="middle" fill="#2b7a6e">Pair A, active</text>
  <rect x="120" y="408" width="360" height="105" rx="14" fill="#f0efeb" stroke="#b8b5ad" stroke-width="2.5"/>
  <text x="300" y="450" font-size="28" font-weight="bold" text-anchor="middle" fill="#3d3d3d">FTD-B1</text>
  <text x="300" y="488" font-size="24" text-anchor="middle" fill="#6f6d66">Pair B, standby</text>
  <text x="300" y="585" font-size="24" text-anchor="middle" fill="#6f6d66">Pair A block preferred here</text>

  <!-- West site -->
  <rect x="840" y="205" width="440" height="420" rx="22" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="868" y="250" font-size="28" font-weight="bold" fill="#3d3d3d">West site</text>
  <rect x="880" y="280" width="360" height="105" rx="14" fill="#f0efeb" stroke="#b8b5ad" stroke-width="2.5"/>
  <text x="1060" y="322" font-size="28" font-weight="bold" text-anchor="middle" fill="#3d3d3d">FTD-A2</text>
  <text x="1060" y="360" font-size="24" text-anchor="middle" fill="#6f6d66">Pair A, standby</text>
  <rect x="880" y="408" width="360" height="105" rx="14" fill="#e6f4f1" stroke="#0e7c6b" stroke-width="2.5"/>
  <text x="1060" y="450" font-size="28" font-weight="bold" text-anchor="middle" fill="#0e5c50">FTD-B2</text>
  <text x="1060" y="488" font-size="24" text-anchor="middle" fill="#2b7a6e">Pair B, active</text>
  <text x="1060" y="585" font-size="24" text-anchor="middle" fill="#6f6d66">Pair B block preferred here</text>

  <!-- interconnect -->
  <line x1="480" y1="332" x2="560" y2="332" stroke="#6f6d66" stroke-width="2"/>
  <line x1="480" y1="460" x2="560" y2="460" stroke="#6f6d66" stroke-width="2"/>
  <line x1="800" y1="332" x2="880" y2="332" stroke="#6f6d66" stroke-width="2"/>
  <line x1="800" y1="460" x2="880" y2="460" stroke="#6f6d66" stroke-width="2"/>
  <rect x="560" y="300" width="240" height="220" rx="16" fill="#fbf1e3" stroke="#b8741f" stroke-width="2.5"/>
  <text x="680" y="352" font-size="26" font-weight="bold" text-anchor="middle" fill="#7a4d10">Colocation L2</text>
  <text x="680" y="392" font-size="24" text-anchor="middle" fill="#9a6a1f">Stretched VLANs</text>
  <text x="680" y="446" font-size="24" text-anchor="middle" fill="#9a6a1f">20 to 25 ms</text>

  <!-- inside networks -->
  <line x1="300" y1="625" x2="300" y2="688" stroke="#6f6d66" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1060" y1="625" x2="1060" y2="688" stroke="#6f6d66" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1000" y1="625" x2="470" y2="688" stroke="#6f6d66" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <line x1="360" y1="625" x2="890" y2="688" stroke="#6f6d66" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <rect x="120" y="690" width="360" height="100" rx="14" fill="#fbeae6" stroke="#b4402f" stroke-width="2.5"/>
  <text x="300" y="730" font-size="26" font-weight="bold" text-anchor="middle" fill="#7a2a1e">East-homed services</text>
  <text x="300" y="765" font-size="22" text-anchor="middle" fill="#b4402f">inside VLAN 110, behind pair A</text>
  <rect x="880" y="690" width="360" height="100" rx="14" fill="#fbeae6" stroke="#b4402f" stroke-width="2.5"/>
  <text x="1060" y="730" font-size="26" font-weight="bold" text-anchor="middle" fill="#7a2a1e">West-homed services</text>
  <text x="1060" y="765" font-size="22" text-anchor="middle" fill="#b4402f">inside VLAN 210, behind pair B</text>
  <text x="680" y="860" font-size="22" text-anchor="middle" fill="#6f6d66">Both inside VLANs are stretched too: after a failover the new active unit</text>
  <text x="680" y="892" font-size="22" text-anchor="middle" fill="#6f6d66">reaches its pair's services across the interconnect (dashed).</text>

  <!-- legend -->
  <rect x="120" y="988" width="26" height="26" rx="6" fill="#e6f4f1" stroke="#0e7c6b" stroke-width="2.5"/>
  <text x="162" y="1009" font-size="24" fill="#3d3d3d">Active unit</text>
  <rect x="360" y="988" width="26" height="26" rx="6" fill="#f0efeb" stroke="#b8b5ad" stroke-width="2.5"/>
  <text x="402" y="1009" font-size="24" fill="#3d3d3d">Standby unit</text>
  <line x1="660" y1="1001" x2="740" y2="1001" stroke="#6f6d66" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="760" y="1009" font-size="24" fill="#3d3d3d">Path after failover</text>
</svg>

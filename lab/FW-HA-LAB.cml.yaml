      interface GigabitEthernet4\n description eBGP to ISP-B (203.0.113.18), stands in for the rest of the internet\n ip address 203.0.113.17 255.255.255.252\n bfd interval 300 min_rx 300 multiplier 3\n no shutdown\n!\ninterface GigabitEthernet5\n description CLIENT eth0 (192.0.2.10)\n ip address 192.0.2.9 255.255.255.248\n no shutdown\n!\n! TRex A client pool is routed to the TRex port address; TRex answers ARP only for that address\nip route 192.0.2.32 255.255.255.224 192.0.2.2\n! aggregate for the ISP-A client space, advertised to everyone\nip route 192.0.2.0 255.255.255.128 Null0\n!\nrouter bgp 64497\n bgp router-id 203.0.113.101\n timers bgp 3 9\n bgp log-neighbor-changes\n no bgp default ipv4-unicast\n neighbor 203.0.113.2 remote-as 64496\n neighbor 203.0.113.2 fall-over bfd\n neighbor 203.0.113.2 description RTR-1 East\n neighbor 203.0.113.6 remote-as 64496\n neighbor 203.0.113.6 fall-over bfd\n neighbor 203.0.113.6 description RTR-3 West\n neighbor 203.0.113.18 remote-as 64498\n\
      \ neighbor 203.0.113.18 fall-over bfd\n neighbor 203.0.113.18 description ISP-B\n !\n address-family ipv4\n  network 192.0.2.0 mask 255.255.255.128\n  neighbor 203.0.113.2 activate\n  neighbor 203.0.113.2 route-map RM-CUST-OUT out\n  neighbor 203.0.113.6 activate\n  neighbor 203.0.113.6 route-map RM-CUST-OUT out\n  neighbor 203.0.113.18 activate\n exit-address-family\n!\nip prefix-list PFX-INTERNET seq 5 permit 192.0.2.0/24 le 25\nroute-map RM-CUST-OUT permit 10\n match ip address prefix-list PFX-INTERNET\nroute-map RM-CUST-OUT deny 20\n!\nend\n"

      no_delay_counter\" : {\n                                \"type\": \"integer\"\n                           },\n\n                           \"rexmtthresh\" : {\n                               \"type\": \"integer\"\n                           },\n                           \"do_rfc1323\" : {\n                               \"type\": \"integer\"\n                           },\n                           \n                           \"keepinit\" : {\n                               \"type\": \"integer\"\n                           },\n                           \"keepidle\" : {\n                               \"type\": \"integer\"\n                           },\n                           \"keepintvl\" : {\n                               \"type\": \"integer\"\n                           },\n                           \"blackhole\" : {\n                               \"type\": \"integer\"\n                           },\n                           \"delay_ack_msec\" : {\n                \

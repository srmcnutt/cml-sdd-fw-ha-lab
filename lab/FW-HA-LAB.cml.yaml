      \                      \"type\": \"object\",\n                         \"properties\": {\n                            \"src_msb\" : {\n                                \"type\": \"array\",\n                                \"items\": {\n                                     \"type\": \"integer\"\n                                },\n                                \"minItems\": 16,\n                                \"maxItems\": 16\n                            },\n\n                            \"dst_msb\" : {\n                                \"type\": \"array\",\n                                \"items\": {\n                                     \"type\": \"integer\"\n                                },\n                                \"minItems\": 16,\n                                \"maxItems\": 16\n                            },\n                            \n                            \"enable\" : {\n                                \"type\": \"integer\"\n                          \

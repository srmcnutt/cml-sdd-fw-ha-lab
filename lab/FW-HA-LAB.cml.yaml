  configuration:
  - name: config.json
    content: "{\n  \"docker\": {\n    \"image\": \"net-tools:1.0.0\",\n    \"mounts\": [\n      \"type=bind,source=cfg/boot.sh,target=/boot.sh\"\n    ]\n  },\n  \"caps\": [\n    \"CAP_CHOWN\",\n    \"CAP_DAC_OVERRIDE\",\n    \"CAP_FOWNER\",\n    \"CAP_FSETID\",\n    \"CAP_KILL\",\n    \"CAP_MKNOD\",\n    \"CAP_NET_BIND_SERVICE\",\n    \"CAP_NET_RAW\",\n    \"CAP_SETFCAP\",\n    \"CAP_SETGID\",\n    \"CAP_SETPCAP\",\n    \"CAP_SETUID\",\n    \"CAP_SYS_CHROOT\",\n    \"NET_ADMIN\",\n    \"SYS_ADMIN\"\n  ],\n  \"day0cmd\": [ \"/bin/bash\", \"/boot.sh\" ],\n  \"busybox\": true\n}\n"
  - name: boot.sh
    content: '# SRV-A: inside test host behind pair A, public 198.51.100.50

      ip address add dev eth0 10.10.0.50/24

      ip link set dev eth0 up

      ip route add default via 10.10.0.1

      command -v iperf3 >/dev/null 2>&1 && iperf3 -s -D

      # keep the next line to indicate that the machine is ready

      echo "READY" >/dev/console

      cat /etc/motd

      exit 0

      '

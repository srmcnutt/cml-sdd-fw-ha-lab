- id: n15
  label: TREX-A
  node_definition: trex
  x: -700
  y: 300
  configuration:
  - name: node.cfg
    content: "# this is a shell script which will be sourced at boot (as root, by virl2-01-day0config.start,\n# before virl2-02-trex.start generates /etc/trex_cfg.yaml and launches TRex stateless in tmux)\nhostname TREX-A\n# configurable user account\nUSERNAME=cisco\nPASSWORD=cisco\n# --- Lab additions ---\n# management address on eth0 (dCloud network, same segment as the FMC)\nip link set dev eth0 up\nip address add 198.18.129.45/18 dev eth0\nip route add default via 198.18.128.1\n# The CML TRex image lacks astf_schema.json; without it TRex exits as soon as a\n# stateful client connects (\"Could not create ASTF validator\"). Restore it from\n# the TRex 2.87 sources (vendor/trex-core/scripts/astf_schema.json).\ncat > /trex/astf_schema.json <<'EOSCHEMA'\n{\n    \"title\": \"astf_profile\",\n    \"description\": \"TRex ASTF profile \",\n    \"type\": \"object\",\n    \"properties\": {\n        \"buf_list\" : {\n           \"$ref\": \"#/definitions/buf_list_t\"\n        },\n\n        \"ip_gen_dist_list\"\
      : {\n           \"$ref\": \"#/definitions/ip_gen_dist_list_t\" \n        },\n \n        \"templates\" : {\n            \"$ref\": \"#/definitions/template_array_t\"\n        },\n        \n        \"program_list\" : {\n            \"$ref\": \"#/definitions/program_array_t\"\n        },\n        \n        \"c_glob_info\" : {\n            \"$ref\": \"#/definitions/glob_info_t\"\n        },\n        \n        \"s_glob_info\" : {\n            \"$ref\": \"#/definitions/glob_info_t\"\n        },\n        \"tg_names\": {\n            \"$ref\": \"#/definitions/tg_names_t\"\n        }\n    },\n    \n    \"required\": [\"buf_list\"],\n    \n    \"definitions\": {\n\n             \"buf_list_t\" : {\n                  \"type\": \"array\",\n                  \"items\": {\n                       \"type\": [ \"string\", \"object\" ]\n                   }\n              },\n\n              \"ip_gen_dist_list_t\" : {\n                  \"type\": \"array\",\n                  \"items\": {\n          \
      \             \"type\": \"object\",\n                       \"properties\": {\n                            \"ip_start\": {\n                              \"type\" : \"string\"\n                            },\n\n                            \"dir\": { \n                               \"type\" : \"string\",\n                               \"enum\" : [\"c\",\"s\"]\n                            },\n\n                            \"distribution\": {\n                              \"type\" : \"string\",\n                              \"enum\" : [\"seq\",\"rand\",\"normal\"]\n                            },\n\n                            \"ip_end\":  {\n                              \"type\" : \"string\"\n                            },\n\n                            \"ip_offset\" : {\n                             \"type\" : \"string\"\n                            }\n                       },\n                       \"required\": [\"ip_start\",\"dir\",\"distribution\",\"ip_end\",\"ip_offset\"\
      ]\n                   }\n             },\n             \n             \"server_template_t\" : {\n                 \"type\": \"object\",\n                 \"properties\": {\n                        \"program_index\": {\n                             \"type\" : \"integer\",\n                             \"minimum\" : 0\n                         },\n                         \"assoc\" : {\n                             \"type\" : \"array\",\n                              \"items\": {\n                                   \"type\": \"object\",\n                                   \"properties\": {\n                                        \"port\": {\n                                            \"type\" : \"integer\",\n                                            \"minimum\" : 0\n                                          }\n                                   }, // for now\n                                   \"required\": [\"port\"]\n                              }\n                         }\n\
      \                 },\n                 \"required\": [\"program_index\",\"assoc\"]\n             },\n\n             \"client_template_t\" : {\n                 \"type\": \"object\",\n                 \"properties\": {\n                        \"program_index\": {\n                             \"type\" : \"integer\",\n                             \"minimum\" : 0\n                         },\n                        \"port\": {\n                             \"type\" : \"integer\",\n                             \"minimum\": 0\n                         },\n\n                        \"glob_info\" : {\n                          \"$ref\": \"#/definitions/glob_info_t\"      \n                        },\n                        \n                        \"cps\": {\n                             \"type\" : \"number\",\n                             \"minimum\" : 0.5\n                         },\n                        \"limit\": {\n                             \"type\" : \"integer\",\n      \
      \                       \"minimum\": 0\n                         },\n                        \"cluster\": {\n                             \"type\" : \"object\"\n                         },\n\n                         \"ip_gen\" : {\n                             \"type\" : \"object\",\n                             \"properties\": { \n\n                               \"dist_server\" : {\n                                   \"type\" : \"object\",\n                                   \"properties\": {\n                                        \"index\": {\n                                           \"type\" : \"integer\",\n                                           \"minimum\": 0\n                                        }\n                                    },\n                                    \"required\": [\"index\"]\n                               },\n\n                               \"dist_client\" : {\n                                   \"type\" : \"object\",\n                  \
      \                 \"properties\": {\n                                        \"index\": {\n                                           \"type\" : \"integer\",\n                                           \"minimum\": 0\n                                        }\n                                    },\n                                    \"required\": [\"index\"]\n                               }\n                            }\n                         }\n                 },\n                 \"required\": [\"program_index\",\"ip_gen\",\"cps\",\"port\"]\n             },\n             \n             /* one template type */   \n             \"template_t\" : {\n                \"type\": \"object\",\n                \"properties\": {\n                  \"server_template\" : {\n                    \"$ref\": \"#/definitions/server_template_t\" \n                  },\n\n                 \"client_template\" : {\n                    \"$ref\": \"#/definitions/client_template_t\" \n            \

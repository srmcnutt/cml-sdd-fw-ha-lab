      \ this file and rewrites trex_cfg.yaml, so the\n# change is made by a detached job that waits for the launcher's tmux session,\n# appends the port gateways, stops the stateless TRex, clears its DPDK runtime\n# state (a stale /var/run/dpdk makes the next start fail at EAL init), and\n# respawns the TREX window with --astf. The job lives in a file so that its own\n# command line never matches the TRex process name it kills.\ncat > /tmp/astf-switch.sh <<'EOS'\n#!/bin/sh\nuntil tmux has-session -t trex 2>/dev/null; do sleep 2; done\nsleep 8\ncat >> /etc/trex_cfg.yaml <<'EOC'\n  port_info:\n    - ip: 192.0.2.130\n      default_gw: 192.0.2.129\n    - ip: 10.20.0.129\n      default_gw: 10.20.0.1\nEOC\npkill -f _t-rex-64-o; sleep 3\npgrep -f _t-rex-64-o >/dev/null && { pkill -9 -f _t-rex-64-o; sleep 2; }\nrm -rf /var/run/dpdk\ntmux respawn-window -k -t trex:TREX -c /trex \"LD_LIBRARY_PATH=/usr/glibc-compat/lib:/lib:/usr/lib ./_t-rex-64-o -i --astf --software --sleeps\"\necho \"astf respawn\
      \ done $(date)\"\nEOS\nchmod +x /tmp/astf-switch.sh\nsetsid sh /tmp/astf-switch.sh >/tmp/astf-switch.log 2>&1 </dev/null &\n"

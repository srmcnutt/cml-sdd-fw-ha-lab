platform console serial
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service config
no aaa new-model
no ip domain lookup
ip domain name internet.lab
!
username admin privilege 15 secret HaLab2026
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 login local
 transport input ssh
!
hostname ISP-A
!
interface Loopback0
 description router-id
 ip address 203.0.113.101 255.255.255.255
!
interface GigabitEthernet1
 description eBGP to RTR-1 East (203.0.113.2)
 ip address 203.0.113.1 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description eBGP to RTR-3 West (203.0.113.6)
 ip address 203.0.113.5 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet3
 description TREX-A eth1 client side (192.0.2.2)
 ip address 192.0.2.1 255.255.255.248
 no shutdown
!
interface GigabitEthernet4
 description eBGP to ISP-B (203.0.113.18), stands in for the rest of the internet
 ip address 203.0.113.17 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet5
 description CLIENT eth0 (192.0.2.10)
 ip address 192.0.2.9 255.255.255.248
 no shutdown
!
! TRex A client pool is routed to the TRex port address; TRex answers ARP only for that address
ip route 192.0.2.32 255.255.255.224 192.0.2.2
! aggregate for the ISP-A client space, advertised to everyone
ip route 192.0.2.0 255.255.255.128 Null0
!
router bgp 64497
 bgp router-id 203.0.113.101
 timers bgp 3 9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 203.0.113.2 remote-as 64496
 neighbor 203.0.113.2 fall-over bfd
 neighbor 203.0.113.2 description RTR-1 East
 neighbor 203.0.113.6 remote-as 64496
 neighbor 203.0.113.6 fall-over bfd
 neighbor 203.0.113.6 description RTR-3 West
 neighbor 203.0.113.18 remote-as 64498
 neighbor 203.0.113.18 fall-over bfd
 neighbor 203.0.113.18 description ISP-B
 !
 address-family ipv4
  network 192.0.2.0 mask 255.255.255.128
  neighbor 203.0.113.2 activate
  neighbor 203.0.113.2 route-map RM-CUST-OUT out
  neighbor 203.0.113.6 activate
  neighbor 203.0.113.6 route-map RM-CUST-OUT out
  neighbor 203.0.113.18 activate
 exit-address-family
!
ip prefix-list PFX-INTERNET seq 5 permit 192.0.2.0/24 le 25
route-map RM-CUST-OUT permit 10
 match ip address prefix-list PFX-INTERNET
route-map RM-CUST-OUT deny 20
!
end

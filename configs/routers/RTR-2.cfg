platform console serial
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service config
no aaa new-model
no ip domain lookup
ip domain name enterprise.lab
!
username admin privilege 15 secret HaLab2026
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 login local
 transport input ssh
!
hostname RTR-2
!
interface Loopback0
 description router-id
 ip address 10.255.0.2 255.255.255.255
!
interface GigabitEthernet1
 description eBGP to ISP-B (203.0.113.9)
 ip address 203.0.113.10 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description 802.1Q trunk to SW-OUT-EAST Ethernet0/1
 no ip address
 no shutdown
!
interface GigabitEthernet2.100
 description OUTSIDE-A VLAN 100, pair A gateway, HSRP group 10
 encapsulation dot1Q 100
 ip address 198.51.100.3 255.255.255.192
 standby version 2
 standby 10 ip 198.51.100.1
 standby 10 priority 110
 standby 10 preempt
!
interface GigabitEthernet2.200
 description OUTSIDE-B VLAN 200, pair B gateway, HSRP group 20
 encapsulation dot1Q 200
 ip address 198.51.100.67 255.255.255.192
 standby version 2
 standby 20 ip 198.51.100.65
 standby 20 priority 100
 standby 20 preempt
!
interface GigabitEthernet3
 description iBGP link to RTR-1
 ip address 10.255.1.2 255.255.255.252
 no shutdown
!
router bgp 64496
 bgp router-id 10.255.0.2
 timers bgp 3 9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 203.0.113.9 remote-as 64498
 neighbor 203.0.113.9 fall-over bfd
 neighbor 203.0.113.9 description ISP-B
 neighbor 10.255.1.1 remote-as 64496
 neighbor 10.255.1.1 description RTR-1 iBGP
 !
 address-family ipv4
  network 198.51.100.0 mask 255.255.255.192
  network 198.51.100.64 mask 255.255.255.192
  neighbor 203.0.113.9 activate
  neighbor 203.0.113.9 route-map RM-ISP-IN in
  neighbor 203.0.113.9 route-map RM-ISP-OUT out
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 next-hop-self
 exit-address-family
!
ip prefix-list PFX-A seq 5 permit 198.51.100.0/26
ip prefix-list PFX-B seq 5 permit 198.51.100.64/26
ip prefix-list PFX-INTERNET seq 5 permit 192.0.2.0/24 le 25
!
! PFX-B is the prefix homed at the OTHER site: prepend so the ISP prefers that site
route-map RM-ISP-OUT permit 10
 match ip address prefix-list PFX-B
 set as-path prepend 64496 64496 64496
route-map RM-ISP-OUT permit 20
 match ip address prefix-list PFX-A PFX-B
route-map RM-ISP-OUT deny 30
!
route-map RM-ISP-IN permit 10
 match ip address prefix-list PFX-INTERNET
route-map RM-ISP-IN deny 20
!
end

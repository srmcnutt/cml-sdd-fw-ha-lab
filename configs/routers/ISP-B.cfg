platform console serial
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service config
no aaa new-model
no ip domain lookup
ip domain name internet.lab
!
username admin privilege 15 secret HaLab2026
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 login local
 transport input ssh
!
hostname ISP-B
!
interface Loopback0
 description router-id
 ip address 203.0.113.102 255.255.255.255
!
interface GigabitEthernet1
 description eBGP to RTR-2 East (203.0.113.10)
 ip address 203.0.113.9 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description eBGP to RTR-4 West (203.0.113.14)
 ip address 203.0.113.13 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
interface GigabitEthernet3
 description TREX-B eth1 client side (192.0.2.130)
 ip address 192.0.2.129 255.255.255.248
 no shutdown
!
interface GigabitEthernet4
 description eBGP to ISP-A (203.0.113.17)
 ip address 203.0.113.18 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
ip route 192.0.2.160 255.255.255.224 192.0.2.130
ip route 192.0.2.128 255.255.255.128 Null0
!
router bgp 64498
 bgp router-id 203.0.113.102
 timers bgp 3 9
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 203.0.113.10 remote-as 64496
 neighbor 203.0.113.10 fall-over bfd
 neighbor 203.0.113.10 description RTR-2 East
 neighbor 203.0.113.14 remote-as 64496
 neighbor 203.0.113.14 fall-over bfd
 neighbor 203.0.113.14 description RTR-4 West
 neighbor 203.0.113.17 remote-as 64497
 neighbor 203.0.113.17 fall-over bfd
 neighbor 203.0.113.17 description ISP-A
 !
 address-family ipv4
  network 192.0.2.128 mask 255.255.255.128
  neighbor 203.0.113.10 activate
  neighbor 203.0.113.10 route-map RM-CUST-OUT out
  neighbor 203.0.113.14 activate
  neighbor 203.0.113.14 route-map RM-CUST-OUT out
  neighbor 203.0.113.17 activate
 exit-address-family
!
ip prefix-list PFX-INTERNET seq 5 permit 192.0.2.0/24 le 25
route-map RM-CUST-OUT permit 10
 match ip address prefix-list PFX-INTERNET
route-map RM-CUST-OUT deny 20
!
end

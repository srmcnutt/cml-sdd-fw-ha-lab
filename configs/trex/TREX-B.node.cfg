# this is a shell script which will be sourced at boot (as root, by virl2-01-day0config.start,
# before virl2-02-trex.start generates /etc/trex_cfg.yaml and launches TRex stateless in tmux)
hostname TREX-B
# configurable user account
USERNAME=cisco
PASSWORD=cisco
# --- Lab additions ---
# management address on eth0 (dCloud network, same segment as the FMC)
ip link set dev eth0 up
ip address add 198.18.129.46/18 dev eth0
ip route add default via 198.18.128.1
# The CML TRex image lacks astf_schema.json; without it TRex exits as soon as a

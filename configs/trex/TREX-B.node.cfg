# Switch TRex to advanced stateful (ASTF) mode with L3 port gateways.
# The stock launcher runs after this file and rewrites trex_cfg.yaml, so the
# change is made by a detached job that waits for the launcher's tmux session,
# appends the port gateways, stops the stateless TRex, clears its DPDK runtime
# state (a stale /var/run/dpdk makes the next start fail at EAL init), and
# respawns the TREX window with --astf. The job lives in a file so that its own
# command line never matches the TRex process name it kills.
cat > /tmp/astf-switch.sh <<'EOS'
#!/bin/sh
until tmux has-session -t trex 2>/dev/null; do sleep 2; done
sleep 8
cat >> /etc/trex_cfg.yaml <<'EOC'
  port_info:
    - ip: 192.0.2.130
      default_gw: 192.0.2.129
    - ip: 10.20.0.129
      default_gw: 10.20.0.1
EOC
pkill -f _t-rex-64-o; sleep 3
pgrep -f _t-rex-64-o >/dev/null && { pkill -9 -f _t-rex-64-o; sleep 2; }
rm -rf /var/run/dpdk
tmux respawn-window -k -t trex:TREX -c /trex "LD_LIBRARY_PATH=/usr/glibc-compat/lib:/lib:/usr/lib ./_t-rex-64-o -i --astf --software --sleeps"
echo "astf respawn done $(date)"
EOS
chmod +x /tmp/astf-switch.sh
setsid sh /tmp/astf-switch.sh >/tmp/astf-switch.log 2>&1 </dev/null &

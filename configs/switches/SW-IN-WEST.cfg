hostname SW-IN-WEST
!
no service config
service timestamps debug datetime msec
service timestamps log datetime msec
no ip domain lookup
!
spanning-tree mode rapid-pvst
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
vlan 110
 name INSIDE-A
vlan 210
 name INSIDE-B
vlan 900
 name FO-A
vlan 901
 name STATE-A
vlan 902
 name FO-B
vlan 903
 name STATE-B
!
interface Ethernet0/0
 description FTD-A2 Gi0/1 inside-A
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 no shutdown
!
interface Ethernet0/1
 description FTD-B2 Gi0/1 inside-B
 switchport mode access
 switchport access vlan 210
 spanning-tree portfast
 no shutdown
!
interface Ethernet0/2
 description FTD-A2 Gi0/2 pair A failover
 switchport mode access
 switchport access vlan 900
 spanning-tree portfast
 no shutdown
!
interface Ethernet0/3
 description FTD-A2 Gi0/3 pair A state
 switchport mode access
 switchport access vlan 901
 spanning-tree portfast
 no shutdown
!
interface Ethernet1/0
 description FTD-B2 Gi0/2 pair B failover
 switchport mode access
 switchport access vlan 902
 spanning-tree portfast
 no shutdown
!
interface Ethernet1/1
 description FTD-B2 Gi0/3 pair B state
 switchport mode access
 switchport access vlan 903
 spanning-tree portfast
 no shutdown
!
interface Ethernet1/2
 description TREX-B eth2 TRex server side
 switchport mode access
 switchport access vlan 210
 spanning-tree portfast
 no shutdown
!
interface Ethernet1/3
 description SRV-B eth0
 switchport mode access
 switchport access vlan 210
 spanning-tree portfast
 no shutdown
!
interface Ethernet2/0
 description INTER-SITE trunk to SW-IN-EAST Ethernet2/0 (conditioned, 25 ms RTT)
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 110,210,900-903
 switchport mode trunk
 no shutdown
!
interface range Ethernet2/1 - 3
 description unused
 shutdown
!
end

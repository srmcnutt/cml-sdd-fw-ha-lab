hostname SW-OUT-WEST
!
no service config
service timestamps debug datetime msec
service timestamps log datetime msec
no ip domain lookup
!
spanning-tree mode rapid-pvst
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
!
vlan 100
 name OUTSIDE-A
vlan 200
 name OUTSIDE-B
!
interface Ethernet0/0
 description RTR-3 Gi2, 802.1Q trunk
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 100,200
 switchport mode trunk
 no shutdown
!
interface Ethernet0/1
 description RTR-4 Gi2, 802.1Q trunk
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 100,200
 switchport mode trunk
 no shutdown
!
interface Ethernet0/2
 description FTD-A2 Gi0/0 outside-A
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 no shutdown
!
interface Ethernet0/3
 description FTD-B2 Gi0/0 outside-B
 switchport mode access
 switchport access vlan 200
 spanning-tree portfast
 no shutdown
!
interface Ethernet1/0
 description INTER-SITE trunk to SW-OUT-EAST Ethernet1/0 (conditioned, 25 ms RTT)
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 100,200
 switchport mode trunk
 no shutdown
!
interface range Ethernet1/1 - 3
 description unused
 shutdown
!
end
